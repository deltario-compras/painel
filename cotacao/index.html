<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Cotação de preços - Delta Rio Elevadores</title>
<meta name="theme-color" content="#08215A">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#08215A}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#08215A}
#capa{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#08215A;color:#dbe4f5;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box;transition:opacity .3s}
#capa img{width:96px;height:96px}
#capa.fora{opacity:0;pointer-events:none}
</style>
</head>
<body>
<iframe id="form" title="Cotação de preços - Delta Rio Elevadores" allow="clipboard-read; clipboard-write"></iframe>
<div id="capa"><img src="../icone-512.png" alt=""><div id="msg">Carregando a cotação…</div></div>
<script>
/* Formulário de cotação do fornecedor. Continua no Google Apps Script; esta página só o mostra, sem o endereço e a faixa do Google. */
var EXEC = 'https://script.google.com/macros/s/AKfycbzb-gG589nBWSBvmzJGj_6MfP3GExCFWFBdV7GsRDCNYj-0sXxo-4r_29_0VZ1OCLip/exec';
var fr = document.getElementById('form'), capa = document.getElementById('capa'), msg = document.getElementById('msg');
var t = (new URLSearchParams(location.search).get('t') || '').replace(/[^A-Za-z0-9_-]/g, '');
function abrir() {
  if (!t) { msg.textContent = 'Link de cotação inválido. Peça um novo link ao comprador da Delta Rio.'; return; }
  if (!navigator.onLine) { msg.textContent = 'Sem internet. A cotação abre sozinha quando a conexão voltar.'; return; }
  msg.textContent = 'Carregando a cotação…';
  fr.src = EXEC + '?t=' + encodeURIComponent(t);
}
fr.addEventListener('load', function () { if (fr.src) setTimeout(function () { capa.classList.add('fora'); }, 300); });
window.addEventListener('online', function () { if (!fr.src) abrir(); });
abrir();
</script>
</body>
</html>
